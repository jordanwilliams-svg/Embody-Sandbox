
<!DOCTYPE html>
<html lang="en">
<head>

<title>Confluence Sandbox — Client Knowledge Hub</title>
<style>
:root{--ink:#172b4d;--muted:#626f86;--line:#dfe1e6;--blue:#0c66e4;--blue-weak:#e9f2ff;--surface:#fff;--canvas:#f7f8fa;--nav:#101113;--shadow:0 3px 12px rgba(9,30,66,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--surface);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.topbar{min-height:54px;background:var(--nav);color:#fff;display:flex;align-items:center;padding:0 20px;gap:17px;position:sticky;top:0;z-index:20;border-bottom:1px solid #252629}.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;font-weight:650;font-size:15px}.brand-mark{width:23px;height:23px;border:2px solid #e349a7;border-radius:7px;transform:rotate(45deg);display:grid;place-items:center;color:#e349a7;font-size:11px;line-height:1}.brand .product{font-weight:500;color:#a9b5c7;margin-left:2px}.topsearch{height:35px;display:flex;align-items:center;gap:9px;border:1px solid #68707c;border-radius:7px;background:#1d1f23;max-width:660px;flex:1;margin:0 auto;padding:0 11px;color:#c7d1e0}.topsearch:focus-within{border-color:#85b8ff;box-shadow:0 0 0 2px #1c4b82}.topsearch input{background:transparent;border:0;outline:0;color:white;width:100%;font:inherit;font-size:14px}.topsearch input::placeholder{color:#c7d1e0}.keyhint{font-size:11px;border:1px solid #555d68;border-radius:4px;padding:1px 5px;color:#aeb8c5}.nav-actions{display:flex;align-items:center;gap:12px}.nav-btn{border:1px solid #616975;background:transparent;color:#fff;border-radius:6px;padding:7px 11px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}.nav-btn:hover{background:#292c31}.avatar{width:28px;height:28px;border-radius:50%;background:#de350b;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700;border:2px solid #fff}
.pagebar{height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:#53657d;border-bottom:1px solid #f1f2f4;font-size:13px}.crumb{display:flex;align-items:center;gap:10px}.crumb a{color:#53657d;text-decoration:none}.crumb a:hover{color:var(--blue)}.page-actions{display:flex;align-items:center;gap:12px}.updated{color:#6b778c}.pill{border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:#fff;color:#42526e;font-size:12px}
main{max-width:1040px;margin:0 auto;padding:54px 25px 75px}.intro{text-align:center;margin:0 auto 32px;max-width:770px}.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#6b778c;font-weight:700;margin:0 0 12px}.intro h1{font-size:30px;line-height:1.25;font-weight:560;letter-spacing:-.025em;margin:0 0 11px;color:#172b4d}.intro p{color:#626f86;margin:0 auto;max-width:620px;font-size:14px}.byline{display:flex;justify-content:center;align-items:center;gap:12px;color:#6b778c;font-size:12px;margin-top:14px}.dot{width:4px;height:4px;background:#97a0af;border-radius:50%}
.directory{max-width:860px;margin:0 auto}.directory-heading{display:flex;justify-content:space-between;align-items:end;margin:35px 0 15px}.directory-heading h2{font-size:19px;margin:0;font-weight:650}.directory-heading p{font-size:12px;color:#6b778c;margin:3px 0 0}.client-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.client-card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:10px;padding:21px;background:#fff;min-height:154px;transition:.16s}.client-card:hover{border-color:#85b8ff;background:#f8fbff;box-shadow:var(--shadow);transform:translateY(-2px)}.client-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.client-logo{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;font-size:16px;font-weight:750;letter-spacing:-.04em}.logo-medvi{background:#e6f4f1;color:#18745f}.logo-embody{background:#fce8f2;color:#b53f83}.logo-altrx{background:#e9efff;color:#3659a8}.logo-gplans{background:#fff2df;color:#a76316}.client-arrow{color:#6b778c;font-size:18px}.client-card h3{font-size:17px;margin:0 0 4px;font-weight:680}.client-card p{font-size:12px;color:#6b778c;margin:0}.client-card-foot{display:flex;align-items:center;gap:7px;margin-top:15px;color:#6b778c;font-size:11px}.status-dot{width:7px;height:7px;border-radius:50%;background:#22a06b}.directory-note{margin:20px auto 0;max-width:860px;background:#f7f8fa;border:1px solid #ebecf0;border-radius:8px;padding:13px 15px;color:#626f86;font-size:12px}.directory-note strong{color:#344563}
.client-intro{max-width:760px;margin:0 auto 27px}.client-title-row{display:flex;align-items:center;gap:15px;margin-bottom:8px}.client-large-logo{width:48px;height:48px;display:grid;place-items:center;border-radius:11px;font-size:18px;font-weight:750;flex:0 0 48px}.client-title-row h1{font-size:27px;line-height:1.2;font-weight:560;letter-spacing:-.025em;margin:0}.client-subtitle{color:#6b778c;font-size:13px;margin:0 0 0 63px}.client-search{max-width:760px;margin:0 auto 27px}.client-search label{display:block;font-size:14px;font-weight:650;margin-bottom:9px}.searchbox{height:51px;border:2px solid #8caff0;border-radius:9px;display:flex;align-items:center;gap:12px;padding:0 14px;box-shadow:0 2px 8px rgba(9,30,66,.08);transition:.15s}.searchbox:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px #e9f2ff}.searchbox input{border:0;outline:0;flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink)}.searchbox input::placeholder{color:#8993a5}.search-icon{font-size:20px;color:#6b778c}.clear-search{border:0;background:transparent;color:#6b778c;font-size:19px;cursor:pointer;padding:3px 5px;display:none}.helper{color:#6b778c;font-size:12px;margin:8px 0 0}.notice{max-width:760px;margin:0 auto 26px;background:#fff4f2;border:1px solid #ffd5cf;border-radius:7px;padding:12px 15px;color:#344563;display:flex;align-items:flex-start;gap:10px}.notice-icon{color:#c9372c;font-size:17px}.notice p{margin:0;font-size:12px}.notice strong{color:#172b4d}.content{max-width:760px;margin:0 auto}.section-head{display:flex;justify-content:space-between;align-items:center;margin:27px 0 13px}.section-head h2{font-size:19px;margin:0;font-weight:650;color:#172b4d}.subtle{font-size:12px;color:#6b778c}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.quick-card{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fff;cursor:pointer;transition:.15s;min-height:99px;text-align:left;color:inherit}.quick-card:hover,.result:hover{border-color:#85b8ff;background:#f7faff;box-shadow:var(--shadow);transform:translateY(-1px)}.quick-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.category-icon{width:27px;height:27px;border-radius:7px;background:#e9f2ff;color:#0c66e4;display:grid;place-items:center;font-size:14px}.arrow{color:#6b778c}.quick-card h3{font-size:13px;margin:0 0 3px;font-weight:650}.quick-card p{font-size:11px;color:#6b778c;margin:0;line-height:1.45}.info-list{border:1px solid var(--line);border-radius:8px;overflow:hidden}.info-row{display:flex;gap:20px;padding:11px 14px;border-bottom:1px solid #ebecf0;font-size:12px}.info-row:last-child{border-bottom:0}.info-row strong{min-width:145px;color:#172b4d}.info-row span{color:#42526e}
.results-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.results-head h2{font-size:19px;margin:0}.result-count{font-size:12px;color:#6b778c}.result-list{display:flex;flex-direction:column;gap:9px}.result{width:100%;border:1px solid var(--line);border-radius:8px;background:white;padding:14px 15px;text-align:left;cursor:pointer;color:inherit;transition:.15s}.result-title{font-weight:650;color:#0c66e4;font-size:14px;margin-bottom:3px}.result-summary{font-size:12px;color:#42526e;margin-bottom:8px}.result-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.tag{border-radius:4px;background:#f1f2f4;padding:3px 7px;color:#44546f;font-size:10px}.demo-tag{background:#fff7d6;color:#974f0c}.empty{border:1px dashed #b3bac5;border-radius:8px;padding:30px;text-align:center;color:#6b778c}.empty strong{display:block;color:#172b4d;font-size:15px;margin-bottom:5px}
.article-head{border-bottom:1px solid #ebecf0;padding-bottom:17px;margin-bottom:20px}.back{border:0;background:transparent;padding:0;color:#0c66e4;cursor:pointer;font:inherit;margin-bottom:17px}.article-head h1{font-weight:560;font-size:26px;line-height:1.3;margin:9px 0}.article-meta{display:flex;gap:9px;align-items:center;color:#6b778c;font-size:12px;flex-wrap:wrap}.article-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:#fff7d6;color:#974f0c;padding:3px 7px;border-radius:4px;font-weight:700}.article-body h2{font-size:17px;margin:23px 0 7px}.article-body p{margin:0 0 11px;color:#344563}.article-callout{background:#e9f2ff;border-left:3px solid #0c66e4;border-radius:4px;padding:12px 14px;margin:18px 0;color:#344563;font-size:12px}.related{margin-top:30px;padding-top:17px;border-top:1px solid #ebecf0}.related h3{margin:0 0 9px;font-size:14px}.related button{display:block;border:0;background:none;padding:5px 0;color:#0c66e4;cursor:pointer;text-align:left;font:inherit}.footer{margin:48px auto 0;max-width:860px;border-top:1px solid #ebecf0;padding-top:14px;display:flex;justify-content:space-between;color:#8993a5;font-size:11px;gap:12px;flex-wrap:wrap}.hidden{display:none!important}
@media(max-width:700px){.topbar{padding:0 11px;gap:9px}.brand{font-size:13px}.brand .product{display:none}.topsearch{margin:0;min-width:0}.keyhint{display:none}.nav-btn{padding:6px 8px;font-size:11px}.pagebar{padding:0 13px}.page-actions .updated{display:none}main{padding:37px 16px 55px}.intro h1{font-size:25px}.client-grid,.quick-grid{grid-template-columns:1fr}.client-card{min-height:135px}.client-subtitle{margin-left:0}.client-title-row h1{font-size:24px}.info-row{display:block}.info-row strong{display:block;margin-bottom:3px}.footer{margin-top:35px}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" aria-label="Confluence Sandbox home"><span class="brand-mark">✦</span><b>Confluence</b><span class="product">Sandbox</span></a>
  <div class="topsearch hidden" id="topSearchWrap"><span aria-hidden="true">⌕</span><input id="topSearch" type="search" placeholder="Search this client's knowledge…" aria-label="Search this client's knowledge"><span class="keyhint">/</span></div>
  <div class="nav-actions"><button class="nav-btn hidden" id="directoryBtn" type="button">← Client directory</button><div class="avatar" title="Sandbox workspace">CS</div></div>
</header>
<div class="pagebar"><div class="crumb" id="breadcrumb"><span>Knowledge Platform</span></div><div class="page-actions"><span class="updated">Demo workspace · Sample content only</span><span class="pill">Sandbox</span></div></div>
<main>
  <section id="directoryView"></section>
  <section id="clientView" class="hidden"></section>
  <div class="footer"><span>Confluence Sandbox · Multi-client knowledge platform</span><span>Fictional demonstration content · Not for operational use</span></div>
</main>
<script>
const CLIENTS=[
 {slug:'medvi',name:'Medvi',initials:'M',logo:'logo-medvi',description:'A dedicated knowledge space for Medvi support teams.',subtitle:'Medvi — Patient Support Knowledge Base'},
 {slug:'embody',name:'Embody',initials:'E',logo:'logo-embody',description:'A dedicated knowledge space for Embody support teams.',subtitle:'Embody — Patient Support Reference Guide'},
 {slug:'altrx',name:'AltRX',initials:'A',logo:'logo-altrx',description:'A dedicated knowledge space for AltRX support teams.',subtitle:'AltRX — Patient Support Knowledge Base'},
 {slug:'gplans',name:'Gplans',initials:'G',logo:'logo-gplans',description:'A dedicated knowledge space for Gplans support teams.',subtitle:'Gplans — Patient Support Knowledge Base'}
];
// Shared fictional articles are intentionally reused across all four client demo spaces.
const articles=[
 {id:'treatment-overview',title:'Understanding Your Treatment Plan',category:'Treatment & medication',icon:'✚',summary:'A plain-language overview of the information a treatment plan may contain.',keywords:['treatment','plan','overview','medication','dose','prescription'],sections:[['Overview','A treatment plan is a personalized summary of care-related information. In a real knowledge base, this article would explain approved terminology, where a patient can review their plan, and which questions should be directed to a qualified care professional.'],['What a plan may include','A plan may summarize the treatment selected by a licensed provider, the intended review schedule, and patient-facing educational resources. The details vary by individual and should always be interpreted in the context of the provider’s instructions.'],['Helpful communication','Use clear, neutral language. Confirm what part of the plan the patient is asking about, reflect their question accurately, and avoid interpreting or changing clinical directions.']]},
 {id:'medication-appearance',title:'Medication Appearance: General Questions',category:'Treatment & medication',icon:'✚',summary:'A sample reference for handling general questions about appearance, packaging, and product information.',keywords:['color','pink','red','vial','appearance','medication','packaging','ingredients'],sections:[['Start with the question','Patients may ask about a change in color, clarity, packaging, or labeling. Record the observation in the patient’s own words and distinguish an appearance question from a request for medical advice.'],['Keep the response within scope','Do not infer product quality, stability, ingredient content, or safety from appearance alone. A real support knowledge base should link to product-specific, approved information reviewed by the appropriate clinical and pharmacy teams.'],['Escalation principle','When a patient reports an unexpected product change or is unsure whether to use a medication, avoid reassurance or use instructions based on assumptions. Direct the question to an appropriately qualified clinical or pharmacy professional.']]},
 {id:'side-effect-questions',title:'Talking About Treatment Side Effects',category:'Treatment & medication',icon:'✚',summary:'Communication principles for listening to patient concerns and recognizing when clinical input is needed.',keywords:['side effects','symptoms','nausea','concern','clinical','safety'],sections:[['Listen and clarify','Allow the patient to explain what they are experiencing. Ask neutral questions to understand their concern without diagnosing, minimizing symptoms, or suggesting a medication change.'],['Supportive communication','Acknowledge the impact of the concern, summarize what you heard, and explain that clinical questions should be reviewed by a qualified professional.'],['Safety boundary','This demo article intentionally contains no symptom triage, treatment advice, or emergency protocol. A production knowledge base must use current, formally approved clinical guidance.']]},
 {id:'shipping-status',title:'Understanding Delivery Status Updates',category:'Orders & delivery',icon:'▣',summary:'An illustrative guide to common delivery-status terms and patient-friendly explanations.',keywords:['order','shipping','delivery','tracking','carrier','shipment','package'],sections:[['Common status language','A tracking page may show labels such as label created, in transit, out for delivery, delivered, or exception. The exact wording and meaning depend on the delivery provider.'],['Set expectations carefully','A status update is a snapshot, not a guarantee of a delivery time. Share only information visible in an approved source and avoid promising a date that has not been confirmed.'],['When information is unclear','A real operational article would identify the approved source of truth and escalation owner. This sandbox deliberately does not name internal systems or prescribe a workflow.']]},
 {id:'billing-basics',title:'Billing & Subscription: Key Terms',category:'Billing & subscriptions',icon:'＄',summary:'A glossary-style introduction to recurring plans, invoices, payment methods, and credits.',keywords:['billing','subscription','invoice','payment','card','credit','refund','charge'],sections:[['Recurring plan','A recurring plan is an arrangement where charges may be scheduled at agreed intervals. The plan terms, price, and renewal conditions should be visible in the applicable customer agreement.'],['Invoices and payment methods','An invoice describes a charge or balance. A payment method is the approved method associated with an account. Never request or store full payment-card details in a support conversation.'],['Credits and refunds','Credits and refunds are different concepts and may be governed by separate terms. A production article should link to the current, approved policy rather than relying on an example or assumption.']]},
 {id:'appointments',title:'Appointment Types: A Patient-Friendly Overview',category:'Appointments & care',icon:'◷',summary:'A high-level explanation of why a patient might see different appointment labels.',keywords:['appointment','booking','schedule','visit','provider','nurse','follow up'],sections:[['Why appointment labels differ','Appointment labels can describe the purpose of a visit, the professional involved, or whether the conversation is an initial or follow-up discussion. Labels and availability vary by service.'],['Helping patients understand','Explain the label in everyday language and confirm what the patient is trying to accomplish. Do not promise availability or select a clinical appointment type based on assumptions.'],['Demo limitation','This article is informational only. It does not contain a booking process, routing matrix, scheduling rule, or internal link.']]},
 {id:'portal-help',title:'Patient Portal: General Navigation Tips',category:'Account & portal',icon:'▦',summary:'Sample self-service guidance for common questions about finding information in an online portal.',keywords:['portal','login','account','password','profile','website','app','access'],sections:[['Getting oriented','A patient portal commonly groups account details, messages, documents, and program information into separate areas. The exact interface depends on the product version.'],['Access questions','For login or access issues, first understand what the patient is seeing and whether the issue is with credentials, verification, or page behavior. Do not ask the patient to share their password or one-time security code.'],['Helpful guidance','Use simple descriptions of buttons and page areas. In a production environment, keep screenshots and navigation steps aligned with the latest approved portal release.']]},
 {id:'communication',title:'Patient Communication: Tone & Clarity',category:'Support essentials',icon:'♡',summary:'A short guide to empathetic, concise, and accurate patient-facing communication.',keywords:['communication','empathy','response','tone','writing','support','patient'],sections:[['Acknowledge the concern','Begin by showing that you understand what the patient is asking. A calm acknowledgement is more useful than an exaggerated apology or a generic script.'],['Be clear and specific','Use plain language, short sentences, and only confirmed details. Explain what is known, what is not yet known, and what the next communication will cover when that information is confirmed.'],['Protect trust','Never invent timelines, policies, product details, or clinical guidance. When information is missing, seek an approved source or the appropriate subject-matter expert.']]}
];
const categories=[['Treatment & medication','✚','Treatment information and general medication questions.'],['Orders & delivery','▣','Sample terminology for orders and delivery updates.'],['Billing & subscriptions','＄','Definitions for common account and payment terms.'],['Appointments & care','◷','Plain-language appointment and care terminology.'],['Account & portal','▦','General portal and account navigation concepts.'],['Support essentials','♡','Communication standards and support fundamentals.']];
const $=id=>document.getElementById(id);let currentClient=null;let currentQuery='';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getRoute(){const p=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);if(p[0]!=='client')return {type:'directory'};const client=CLIENTS.find(c=>c.slug===p[1]);if(!client)return {type:'directory'};if(p[2]==='article'&&p[3])return {type:'article',client,id:p[3]};return {type:'client',client};}
function goDirectory(){location.hash='#/';}
function showDirectory(){currentClient=null;currentQuery='';$('directoryView').classList.remove('hidden');$('clientView').classList.add('hidden');$('topSearchWrap').classList.add('hidden');$('directoryBtn').classList.add('hidden');$('breadcrumb').innerHTML='<span>Knowledge Platform</span>';document.title='Confluence Sandbox — Client Knowledge Hub';$('directoryView').innerHTML=`<div class="intro"><p class="eyebrow">Multi-client support platform</p><h1>Confluence Sandbox</h1><p>One central place to access client-specific knowledge bases. Choose a client below to explore its searchable support reference space.</p><div class="byline"><span>◉ Knowledge Platform</span><span class="dot"></span><span>4 client workspaces</span><span class="dot"></span><span>Interactive prototype</span></div></div><div class="directory"><div class="directory-heading"><div><h2>Client workspaces</h2><p>Select a client to open its knowledge base</p></div><span class="subtle">4 workspaces</span></div><div class="client-grid">${CLIENTS.map(c=>`<a class="client-card" href="#/client/${c.slug}"><div class="client-card-top"><span class="client-logo ${c.logo}">${c.initials}</span><span class="client-arrow">↗</span></div><h3>${c.name}</h3><p>${c.description}</p><div class="client-card-foot"><span class="status-dot"></span> Knowledge base available <span>·</span> <span>Demo</span></div></a>`).join('')}</div><div class="directory-note"><strong>Prototype notice:</strong> All client spaces currently use the same fictional sample articles to demonstrate the platform structure. No client-specific policies, patient records, or real operating procedures are included.</div></div>`;}
function clientShell(c){currentClient=c;$('directoryView').classList.add('hidden');$('clientView').classList.remove('hidden');$('topSearchWrap').classList.remove('hidden');$('directoryBtn').classList.remove('hidden');$('topSearch').value='';$('breadcrumb').innerHTML=`<a href="#/">Client workspaces</a><span>›</span><span>${esc(c.name)}</span>`;document.title=`${c.name} — Confluence Sandbox`;currentQuery='';$('clientView').innerHTML=`<div class="client-intro"><div class="client-title-row"><span class="client-large-logo ${c.logo}">${c.initials}</span><h1>${esc(c.subtitle)}</h1></div><p class="client-subtitle">${esc(c.name)} knowledge space · Fictional demonstration content</p></div><div class="client-search"><label for="mainSearch">What are you looking for?</label><div class="searchbox"><span class="search-icon" aria-hidden="true">⌕</span><input id="mainSearch" type="search" placeholder="Search articles, topics, or keywords…" autocomplete="off"><button class="clear-search" id="clearSearch" aria-label="Clear search">×</button></div><p class="helper">Search across article titles, descriptions, keywords, and article content.</p></div><div id="searchResults" class="content hidden" aria-live="polite"></div><div id="clientHome"><div class="notice"><span class="notice-icon">ⓘ</span><p><strong>Presentation sandbox:</strong> This workspace contains fictional sample content for demonstrating knowledge search and article navigation. It is not an official ${esc(c.name)} policy or a source of clinical, billing, or operational instructions.</p></div><div class="content"><div class="section-head"><h2>Browse by topic</h2><span class="subtle">Explore sample knowledge areas</span></div><div class="quick-grid" id="categoryGrid"></div><div class="section-head"><h2>Quick info</h2><span class="subtle">Workspace overview</span></div><div class="info-list"><div class="info-row"><strong>Client workspace</strong><span>${esc(c.name)} Patient Support</span></div><div class="info-row"><strong>Purpose</strong><span>Centralized, searchable reference information</span></div><div class="info-row"><strong>Content status</strong><span>Fictional demonstration data</span></div><div class="info-row"><strong>Knowledge articles</strong><span>${articles.length} sample articles</span></div></div><div class="section-head"><h2>Popular articles</h2><span class="subtle">Sample articles</span></div><div class="result-list" id="popularList"></div></div></div><div id="articleView" class="content hidden"></div>`;renderCategories();renderPopular();}
function card(a){return `<button class="result" data-open="${a.id}"><div class="result-title">${esc(a.title)} <span class="arrow">↗</span></div><div class="result-summary">${esc(a.summary)}</div><div class="result-meta"><span class="tag">${esc(a.category)}</span><span class="tag demo-tag">Demo content</span></div></button>`;}
function searchable(a){return [a.title,a.category,a.summary,a.keywords.join(' '),...a.sections.flat()].join(' ').toLowerCase();}
function wireArticleLinks(){document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{location.hash=`#/client/${currentClient.slug}/article/${b.dataset.open}`;}));}
function runSearch(q){if(!currentClient)return;currentQuery=q;const query=q.trim().toLowerCase();$('topSearch').value=q;const main=$('mainSearch');if(main)main.value=q;const clear=$('clearSearch');if(clear)clear.style.display=q?'block':'none';const results=$('searchResults'),home=$('clientHome'),article=$('articleView');if(!query){results.classList.add('hidden');home.classList.remove('hidden');article.classList.add('hidden');return;}home.classList.add('hidden');article.classList.add('hidden');results.classList.remove('hidden');const found=articles.map(a=>({a,score:(a.title.toLowerCase().includes(query)?5:0)+(a.category.toLowerCase().includes(query)?3:0)+(a.keywords.join(' ').toLowerCase().includes(query)?2:0)+(searchable(a).includes(query)?1:0)})).filter(x=>x.score>0).sort((x,y)=>y.score-x.score||x.a.title.localeCompare(y.a.title)).map(x=>x.a);results.innerHTML=`<div class="results-head"><h2>Search results</h2><span class="result-count">${found.length} ${found.length===1?'article':'articles'} for “${esc(q.trim())}”</span></div>${found.length?`<div class="result-list">${found.map(card).join('')}</div>`:`<div class="empty"><strong>No matching articles found</strong>Try another keyword, or browse the topics below.</div>`}`;wireArticleLinks();}
function renderCategories(){$('categoryGrid').innerHTML=categories.map(([name,icon,desc])=>`<button class="quick-card" data-category="${esc(name)}"><div class="quick-top"><span class="category-icon">${icon}</span><span class="arrow">↗</span></div><h3>${esc(name)}</h3><p>${esc(desc)}</p></button>`).join('');document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{runSearch(b.dataset.category);window.scrollTo({top:0,behavior:'smooth'});}));}
function renderPopular(){$('popularList').innerHTML=articles.slice(0,4).map(card).join('');wireArticleLinks();}
function renderArticle(c,id){currentClient=c;$('directoryView').classList.add('hidden');$('clientView').classList.remove('hidden');$('topSearchWrap').classList.add('hidden');$('directoryBtn').classList.remove('hidden');$('topSearch').value='';$('breadcrumb').innerHTML=`<a href="#/">Client workspaces</a><span>›</span><a href="#/client/${c.slug}">${esc(c.name)}</a><span>›</span><span>Article</span>`;document.title=`${c.name} article — Confluence Sandbox`;const a=articles.find(x=>x.id===id);if(!a){location.hash=`#/client/${c.slug}`;return;}$('clientView').innerHTML=`<div class="client-intro"><div class="client-title-row"><span class="client-large-logo ${c.logo}">${c.initials}</span><h1>${esc(c.subtitle)}</h1></div></div><div id="articleView" class="content"><button class="back" id="backClient">← Back to ${esc(c.name)} knowledge base</button><div class="article-head"><div class="article-meta"><span class="article-label">Fictional demo article</span><span>${esc(a.category)}</span><span>·</span><span>Sample reference</span></div><h1>${esc(a.title)}</h1><div class="article-meta"><span>${esc(c.name)} Sandbox Team</span><span>·</span><span>2 min read</span></div></div><div class="notice"><span class="notice-icon">ⓘ</span><p><strong>Demo content only.</strong> This example is not an official ${esc(c.name)} policy, clinical recommendation, or instruction for handling a real patient case.</p></div><article class="article-body">${a.sections.map(([h,p])=>`<h2>${esc(h)}</h2><p>${esc(p)}</p>`).join('')}<div class="article-callout"><strong>For a real deployment:</strong> replace this sample with approved client documentation, named content owners, review dates, and source links.</div></article><div class="related"><h3>Related articles</h3>${articles.filter(x=>x.category===a.category&&x.id!==a.id).slice(0,3).map(x=>`<button data-open="${x.id}">${esc(x.title)} ↗</button>`).join('')||'<span class="subtle">No related articles in this demo category.</span>'}</div></div>`;$('backClient').addEventListener('click',()=>{location.hash=`#/client/${c.slug}`;});wireArticleLinks();}
function renderRoute(){const r=getRoute();if(r.type==='directory'){showDirectory();return;}if(r.type==='client'){clientShell(r.client);return;}renderArticle(r.client,r.id);}
$('directoryBtn').addEventListener('click',goDirectory);$('topSearch').addEventListener('input',e=>runSearch(e.target.value));document.addEventListener('input',e=>{if(e.target&&e.target.id==='mainSearch')runSearch(e.target.value);});document.addEventListener('click',e=>{if(e.target&&e.target.id==='clearSearch')runSearch('');});document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&currentClient&&$('mainSearch')){e.preventDefault();$('topSearch').focus();}if(e.key==='Escape'&&currentClient&&$('mainSearch')){runSearch('');$('topSearch').blur();const m=$('mainSearch');if(m)m.blur();}});window.addEventListener('hashchange',renderRoute);renderRoute();
</script>
</body>
</html>
